
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My_LifeOS - Personal Life Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="sidebar">

        <div class="logo">
            <h2>My_LifeOS<span>.</span></h2>
            <p>PERSONAL COMMAND CENTER</p>
        </div>

        <div class="menu">
            <p class="menu-heading">MENU</p>

            
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                Dashboard
            </a>

            <a href="/tasks" class="nav-link {% if request.path == '/tasks' %}active{% endif %}">
                My Tasks
            </a>

            <a href="/expenses" class="nav-link {% if request.path == '/expenses' %}active{% endif %}">
                Expenses
            </a>

            <a href="/study" class="nav-link {% if request.path == '/study' %}active{% endif %}">
                Study Tracker
            </a>

            <a href="/habits" class="nav-link {% if request.path == '/habits' %}active{% endif %}">
                Habit Tracker
            </a>

            <a href="/analytics" class="nav-link {% if request.path == '/analytics' %}active{% endif %}">
                Analytics
            </a>

        </div>

        <div class="profile">
            <h5>My Workspace</h5>
            <p>Personal Account</p>
        </div>

    </div>

    <div class="main-content">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
